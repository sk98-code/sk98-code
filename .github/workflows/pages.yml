name: Deploy lineage viewer to GitHub Pages

# Publishes the lineage *viewer* as a static site. Scanning is not part of it
# and cannot be: a static page cannot hold a service-principal secret, and the
# Power BI admin APIs and XMLA endpoints are not reachable from a browser.
# Users scan locally with the CLI and open the resulting graph.json here — the
# file is read in their browser and never uploaded.

on:
  push:
    branches:
      - main
      - claude/bi-migration-platform-dlles0
      - claude/powerbi-fabric-column-lineage-tarxqb
    paths:
      - "lineage-ui/**"
      - "src/pbilineage/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the running one.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pbilineage
        run: pip install -e .

      - name: Verify the graph pipeline before shipping a viewer for it
        run: |
          pip install pytest
          pytest -q tests/test_lineage_graph.py tests/test_lineage_parsers.py

      - name: Generate the bundled demo graph
        # The page is useful on first load rather than an empty canvas.
        run: pbilineage demo --out lineage-ui/public/demo-graph.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lineage-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: lineage-ui
        run: npm ci

      - name: Test the client-side graph queries
        working-directory: lineage-ui
        run: npm test

      - name: Build
        working-directory: lineage-ui
        env:
          # Project pages are served from /<repo>/, so assets and the bundled
          # demo need that prefix. STATIC=1 tells the app there is no API here.
          BASE: /${{ github.event.repository.name }}/
          STATIC: "1"
          OUT_DIR: ../dist-pages
        run: npm run build

      # Keep the built site retrievable even when the deploy below cannot
      # run, so a blocked Pages setting never costs you the build output.
      - name: Upload the built site as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineage-viewer-site
          path: dist-pages
          retention-days: 14

      # Turning Pages on requires repository admin, which the workflow token
      # does not have: `enablement: true` fails with "Resource not accessible
      # by integration". So check first and say exactly what to do, rather
      # than failing inside an action with a less specific message.
      - name: Check that Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "::error title=GitHub Pages is not enabled for this repository::\
          Enable it once at https://github.com/${{ github.repository }}/settings/pages \
          — set 'Build and deployment' → Source to 'GitHub Actions', then re-run this \
          workflow. The built site from this run is attached as the \
          'lineage-viewer-site' artifact in the meantime."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
