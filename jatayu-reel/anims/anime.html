<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jatayu – Anime</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; width: auto; aspect-ratio: 9 / 16; display: block; }
  #hud { position: fixed; left: 8px; bottom: 8px; color: #ddd; font: 12px/1.3 monospace; }
  body.render #hud { display: none; }
  body.render canvas { height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="hud"></div>
<script src="shapes.js"></script>
<script src="anime-kit.js"></script>
<script>
/*
 * Style 06 – Anime (TV-anime cel shading), cinematic cut.
 *
 * Paint only: shapes, rig, timing and camera come from shapes.js.
 * - three-tone cel shading lit from the sun (rim light, base, hard shadow), bold ink
 * - per-feather wings, fanned tail, gripping talons, screeching head
 * - camera push-in, punch zoom + shake at the strike, slow motion into the hit
 * - speed lines and motion trails in the dive, 3 black/white impact frames + 1 red frame
 * - lens flare, god rays, bloom, depth-of-field foreground wisps, grade, film grain
 * renderFrame(t) is a pure function of t.
 */
(function () {
  const S = window.Shapes;
  const { W, H, FPS, STRIKE_T, TAU, clamp, lerp, smooth, hash } = S;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const off = mk(W, H), octx = off.getContext('2d');
  const layer = mk(W, H), lctx = layer.getContext('2d');
  const bloom = mk(W / 4, H / 4), bctx = bloom.getContext('2d');
  const grain = mk(W / 4, H / 4), gctx = grain.getContext('2d');
  const grainData = gctx.createImageData(W / 4, H / 4);

  const K = window.AnimeKit;
  const { INK, P, LW, rot, cel3, viman, drawJatayu, birds, burstFeathers, speedLines, starBurst, radialLines } = K;
  function camMatrix(cam, depth = 1) {
    const m = new DOMMatrix();
    const z = 1 + (cam.z - 1) * depth;
    const fx = 540 + (cam.fx - 540) * depth, fy = 960 + (cam.fy - 960) * depth;
    return m.translate(W / 2 + cam.sx * depth, H / 2 + cam.sy * depth)
      .rotate(cam.rot * depth * 180 / Math.PI).scale(z, z).translate(-fx, -fy);
  }

  // =================================================================
  // BACKGROUND
  // =================================================================
  function sunPos(cam) { return camMatrix(cam, 0.15).transformPoint(new DOMPoint(905, 250)); }

  function sky(c, t, cam) {
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0841b0'); g.addColorStop(0.32, '#1f7ee8');
    g.addColorStop(0.62, '#7cc8ff'); g.addColorStop(0.8, '#cdeeff'); g.addColorStop(1, '#eef8ff');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    const sp = sunPos(cam);
    const glow = c.createRadialGradient(sp.x, sp.y, 30, sp.x, sp.y, 560);
    glow.addColorStop(0, 'rgba(255,255,236,1)');
    glow.addColorStop(0.14, 'rgba(255,244,196,0.6)');
    glow.addColorStop(0.45, 'rgba(255,226,170,0.14)');
    glow.addColorStop(1, 'rgba(255,220,170,0)');
    c.fillStyle = glow; c.fillRect(0, 0, W, H);
    c.fillStyle = '#fffef6'; c.beginPath(); c.arc(sp.x, sp.y, 74, 0, TAU); c.fill();
  }

  function godRays(c, t, cam) {
    const sp = sunPos(cam);
    c.save(); c.globalCompositeOperation = 'screen';
    for (let i = 0; i < 11; i++) {
      const a = 1.75 + i * 0.16 + 0.04 * Math.sin(0.6 * t + i * 1.7);
      const w = 0.025 + 0.04 * hash(i, 61);
      const len = 1500 + 600 * hash(i, 62);
      const g = c.createRadialGradient(sp.x, sp.y, 60, sp.x, sp.y, len);
      const al = 0.07 + 0.07 * hash(i, 63);
      g.addColorStop(0, `rgba(255,248,215,${al})`); g.addColorStop(1, 'rgba(255,248,215,0)');
      c.fillStyle = g;
      c.beginPath(); c.moveTo(sp.x, sp.y);
      c.lineTo(sp.x + Math.cos(a - w) * len, sp.y + Math.sin(a - w) * len);
      c.lineTo(sp.x + Math.cos(a + w) * len, sp.y + Math.sin(a + w) * len);
      c.closePath(); c.fill();
    }
    c.restore();
  }

  function farClouds(c, tau, cam) {
    c.save();
    c.setTransform(camMatrix(cam, 0.45));
    c.filter = 'blur(2px)';
    const drift = -10 * tau;
    const list = [
      [S.cumulus(150 + drift, 1150, 300, 3), 28],
      [S.cumulus(910 + drift * 0.6, 1210, 250, 7), 24],
      [S.cumulus(30 + drift * 1.4, 560, 120, 11), 14],
      [S.cumulus(1040 + drift * 1.2, 700, 90, 19), 12],
    ];
    const pal = ['#fffcef', '#eef4ff', '#a9c1e9'];
    for (const [p, d] of list) cel3(c, p, pal, LW, d * 1.4, 10, 0);
    c.restore();
  }

  function seaLayer(c, tau, layerId, baseY, r, sp, speed, pal, deep) {
    const band = S.cloudBand(tau, layerId, baseY, r, sp, speed);
    cel3(c, band, pal, LW, 30, 9, 0);
    c.save(); c.clip(band);
    c.fillStyle = pal[2]; c.fill(S.cloudBand(tau, layerId + 10, baseY + r * 0.9, r * 0.8, sp * 0.9, speed));
    c.fillStyle = deep; c.fill(S.cloudBand(tau, layerId + 20, baseY + r * 2.1, r * 0.7, sp * 0.8, speed));
    c.restore();
  }

  function cloudSea(c, tau, cam, front) {
    c.save();
    if (!front) {
      c.setTransform(camMatrix(cam, 0.75));
      seaLayer(c, tau, 1, 1330, 120, 150, 30, ['#fffbee', '#e3edfc', '#a6bee8'], '#8ea9db');
      c.setTransform(camMatrix(cam, 0.88));
      seaLayer(c, tau, 2, 1440, 140, 170, 55, ['#fffcf0', '#f3f8ff', '#b1c7ec'], '#95b0df');
    } else {
      c.setTransform(camMatrix(cam, 1.08));
      seaLayer(c, tau, 3, 1590, 170, 200, 95, ['#fffdf4', '#ffffff', '#bacfef'], '#9db7e2');
      c.setTransform(camMatrix(cam, 1.2));
      seaLayer(c, tau, 4, 1800, 200, 230, 140, ['#fffdf4', '#ffffff', '#c3d5f1'], '#a6bee6');
    }
    c.restore();
  }

  // =================================================================
  // PUSHPAK VIMAN
  // =================================================================

  function flashAndFlare(c, t, K) {
    const s = t - STRIKE_T;
    if (s < 0 || s > 1.6) return;
    const fa = 0.4 * (1 - smooth((s - 0.12) / 0.22));
    if (fa > 0) { c.fillStyle = `rgba(255,252,235,${fa})`; c.fillRect(0, 0, W, H); }
    // shock ring
    const ru = smooth((s - 0.12) / 0.6);
    if (ru > 0 && ru < 1) {
      c.save(); c.globalAlpha = 1 - ru;
      c.strokeStyle = '#ffffff'; c.lineWidth = 18 * (1 - ru) + 2;
      c.beginPath(); c.ellipse(K.x, K.y, 60 + 520 * ru, 40 + 330 * ru, -0.2, 0, TAU); c.stroke();
      c.restore();
    }
    // star burst
    const bu = smooth((s - 0.12) / 0.35), ba = 1 - smooth((s - 0.32) / 0.35);
    if (ba > 0) {
      c.save(); c.globalAlpha = ba;
      starBurst(c, K.x, K.y, lerp(40, 130, bu), lerp(120, 360, bu), 14, s * 0.6);
      c.fillStyle = '#fff4b8'; c.fill(); c.lineWidth = 7; c.strokeStyle = '#ff9a1c'; c.stroke();
      starBurst(c, K.x, K.y, lerp(20, 60, bu), lerp(60, 190, bu), 9, 0.3 - s * 0.4);
      c.fillStyle = '#ffffff'; c.fill();
      c.restore();
    }
    // lens flare
    const la = 1 - smooth((s - 0.25) / 1.25);
    if (la <= 0) return;
    c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = la;
    const core = c.createRadialGradient(K.x, K.y, 0, K.x, K.y, 320);
    core.addColorStop(0, 'rgba(255,255,255,0.8)'); core.addColorStop(0.2, 'rgba(255,228,160,0.3)');
    core.addColorStop(1, 'rgba(255,200,120,0)');
    c.fillStyle = core; c.fillRect(K.x - 320, K.y - 320, 640, 640);
    const streak = c.createLinearGradient(K.x - 800, 0, K.x + 800, 0);
    streak.addColorStop(0, 'rgba(110,180,255,0)'); streak.addColorStop(0.5, 'rgba(210,238,255,0.95)');
    streak.addColorStop(1, 'rgba(110,180,255,0)');
    c.fillStyle = streak; c.beginPath(); c.ellipse(K.x, K.y, 800, 8, 0, 0, TAU); c.fill();
    const ghosts = [[0.5, 30, '120,255,220'], [1.1, 72, '255,120,220'], [1.45, 24, '255,230,120'],
                    [1.8, 120, '140,180,255'], [2.2, 50, '170,255,140'], [2.6, 18, '255,255,255']];
    for (const [k, r, rgb] of ghosts) {
      const gx = K.x + (W / 2 - K.x) * k, gy = K.y + (H / 2 - K.y) * k;
      const g = c.createRadialGradient(gx, gy, 0, gx, gy, r);
      g.addColorStop(0, `rgba(${rgb},0.04)`); g.addColorStop(0.82, `rgba(${rgb},0.2)`); g.addColorStop(1, `rgba(${rgb},0)`);
      c.fillStyle = g; c.beginPath(); c.arc(gx, gy, r, 0, TAU); c.fill();
    }
    c.restore();
  }

  function foregroundWisps(c, t) {
    c.save(); c.filter = 'blur(16px)';
    // low wisps racing past the lens
    for (let i = 0; i < 4; i++) {
      const x = ((i * 520 - 340 * t) % 2080 + 2080) % 2080 - 500;
      const y = 1830 + 60 * hash(i, 71);
      c.globalAlpha = 0.85;
      c.fillStyle = '#ffffff';
      c.fill(S.puffs([{ x, y, r: 150 }, { x: x + 150, y: y + 30, r: 120 }, { x: x - 140, y: y + 40, r: 110 }]));
    }
    // one wisp crosses the top during the dive
    const u = clamp((t - 0.15) / 1.0);
    if (u > 0 && u < 1) {
      c.filter = 'blur(26px)'; c.globalAlpha = 0.55 * Math.sin(u * Math.PI);
      const x = lerp(1300, -350, u), y = lerp(180, 620, u);
      c.fill(S.puffs([{ x, y, r: 170 }, { x: x + 180, y: y - 30, r: 130 }, { x: x - 160, y: y + 20, r: 120 }]));
    }
    c.restore();
  }

  function post(c, f) {
    // bloom
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.filter = 'blur(7px) brightness(0.9) contrast(1.4)';
    bctx.clearRect(0, 0, bloom.width, bloom.height);
    bctx.drawImage(canvas, 0, 0, bloom.width, bloom.height);
    c.save();
    c.globalCompositeOperation = 'screen'; c.globalAlpha = 0.16;
    c.drawImage(bloom, 0, 0, W, H);
    // grade: warm sun side, cool shadow side
    c.globalCompositeOperation = 'soft-light'; c.globalAlpha = 0.35;
    const g = c.createLinearGradient(W, 0, 0, H);
    g.addColorStop(0, '#ffb05e'); g.addColorStop(0.55, '#808080'); g.addColorStop(1, '#2d5fc8');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // vignette
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    const v = c.createRadialGradient(W / 2, H * 0.45, H * 0.32, W / 2, H * 0.5, H * 0.78);
    v.addColorStop(0, 'rgba(5,10,40,0)'); v.addColorStop(1, 'rgba(5,10,40,0.38)');
    c.fillStyle = v; c.fillRect(0, 0, W, H);
    // film grain (seeded by frame)
    const d = grainData.data;
    for (let i = 0, n = d.length / 4; i < n; i++) {
      const g2 = 96 + 64 * hash(f, i, 91);
      d[4 * i] = d[4 * i + 1] = d[4 * i + 2] = g2; d[4 * i + 3] = 255;
    }
    gctx.putImageData(grainData, 0, 0);
    c.globalCompositeOperation = 'overlay'; c.globalAlpha = 0.16;
    c.drawImage(grain, 0, 0, W, H);
    c.restore();
  }

  // =================================================================
  // SCENE
  // =================================================================
  function scene(c, t, f) {
    const tau = S.sceneTime(t);
    const cam = S.camera(t);
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    sky(c, t, cam);
    godRays(c, t, cam);
    farClouds(c, tau, cam);
    cloudSea(c, tau, cam, false);

    const m = camMatrix(cam, 1);
    c.setTransform(m);
    birds(c, tau);

    // viman on its own layer so a gold sheen can sweep across it
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.clearRect(0, 0, W, H);
    lctx.setTransform(m);
    viman(lctx, tau);
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.globalCompositeOperation = 'source-atop';
    const sx = lerp(-500, 1600, (t % 2.5) / 2.5);
    const sh = lctx.createLinearGradient(sx - 160, 0, sx + 160, 220);
    sh.addColorStop(0, 'rgba(255,255,230,0)'); sh.addColorStop(0.5, 'rgba(255,255,230,0.45)'); sh.addColorStop(1, 'rgba(255,255,230,0)');
    lctx.fillStyle = sh; lctx.fillRect(0, 0, W, H);
    lctx.globalCompositeOperation = 'source-over';
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(layer, 0, 0);

    c.setTransform(1, 0, 0, 1, 0, 0);
    speedLines(c, t, f);
    c.setTransform(m);
    if (tau < 1.62) {                                    // motion trail in the dive
      for (let k = 3; k >= 1; k--) drawJatayu(c, tau - 0.028 * k, 0.12 * (4 - k));
    }
    drawJatayu(c, tau);
    burstFeathers(c, tau);
    c.restore();

    cloudSea(c, tau, cam, true);
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
    foregroundWisps(c, t);
    c.restore();
    return { cam, m, K: m.transformPoint(new DOMPoint(S.kalashWorld(STRIKE_T).x, S.kalashWorld(STRIKE_T).y)) };
  }

  function renderFrame(t) {
    const f = Math.round(t * FPS);
    const sf = S.STRIKE_FRAME;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    if (f >= sf && f <= sf + 3) {
      // impact frames: three black/white, then one red
      octx.setTransform(1, 0, 0, 1, 0, 0);
      const { K } = scene(octx, t, f);
      const i = f - sf;
      if (i < 3) {
        const invert = i !== 1;
        ctx.filter = `grayscale(1) contrast(40) brightness(${invert ? 1.25 : 1.05})${invert ? ' invert(1)' : ''}`;
        ctx.drawImage(off, 0, 0);
        ctx.filter = 'none';
        radialLines(ctx, K.x, K.y, f, invert ? '#ffffff' : '#000000');
        starBurst(ctx, K.x, K.y, 70, 220, 11, 0.2 * i);
        ctx.fillStyle = invert ? '#ffffff' : '#000000'; ctx.fill();
      } else {
        ctx.filter = 'grayscale(1) contrast(40) brightness(1.1)';
        ctx.drawImage(off, 0, 0);
        ctx.filter = 'none';
        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = '#ff1e2d'; ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'source-over';
        radialLines(ctx, K.x, K.y, f, '#14000a');
      }
      return;
    }

    const { K } = scene(ctx, t, f);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    flashAndFlare(ctx, t, K);
    post(ctx, f);
  }

  window.renderFrame = renderFrame;
  window.__ready = true;

  // ---------- browser preview: loops 0–5 s, ?t=2.0 freezes a frame ----------
  const params = new URLSearchParams(location.search);
  if (params.has('render')) { document.body.classList.add('render'); return; }
  const hud = document.getElementById('hud');
  if (params.has('t')) { const t = +params.get('t'); renderFrame(t); hud.textContent = `t=${t.toFixed(2)}s`; return; }
  const t0 = performance.now();
  (function loop(now) {
    const t = (((now - t0) / 1000) % S.DUR);
    const tf = Math.floor(t * FPS) / FPS;
    renderFrame(tf);
    hud.textContent = `t=${tf.toFixed(2)}s  frame ${Math.round(tf * FPS)}`;
    requestAnimationFrame(loop);
  })(t0);
})();
</script>
</body>
</html>
