<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Sampati aur Jatayu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: 'Noto Sans Devanagari'; font-weight: 700; src: url(../fonts/noto-sans-devanagari-devanagari-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Rozha One'; src: url(../fonts/rozha-one-devanagari-400-normal.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; width: auto; aspect-ratio: 9 / 16; display: block; }
  body.render canvas { height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../../anims/shapes.js"></script>
<script src="../../anims/anime-kit.js"></script>
<script src="cine.js"></script>
<script src="figures.js"></script>
<script src="lanka.js"></script>
<script src="timeline3.js"></script>
<script>
/*
 * सम्पाती और जटायु — realistic cinematic cut (storyboard v2), drawn entirely in code.
 * Shots follow STORYBOARD.md; timing comes from timeline3.js (voice-driven).
 * renderFrame(t) is a pure function of t.
 */
(function () {
  const S = window.Shapes, K = window.AnimeKit, C = window.Cine, F = window.Figures, TL = window.TIMELINE3;
  const { W, H, FPS, TAU, clamp, lerp, smooth, hash } = S;
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const bufA = mk(W, H), bufB = mk(W, H), bloom = mk(W / 4, H / 4), grain = mk(W / 4, H / 4);
  const bctx = bloom.getContext('2d'), gctx = grain.getContext('2d'), gdata = gctx.createImageData(W / 4, H / 4);

  // ---------------------------------------------------------------- birds
  const PALS = {
    youngJ: { feather: ['#b89070', '#6a4a32', '#33221a', '#e8d6c0'], featherFar: ['#8a6a50', '#4a3424', '#22160e', '#b8a080'], covert: ['#c8a07a', '#7a5638', '#3e2818', '#f0dcc4'], body: ['#a07a5a', '#5a3e2a', '#2a1a10'], skin: ['#f0c8c0', '#d89a98', '#a86870'] },
    youngS: { feather: ['#c48a5c', '#7a4428', '#3a1a0c', '#f0d0b0'], featherFar: ['#94603e', '#552a16', '#2a1208', '#c49a78'], covert: ['#d8a070', '#925430', '#4e2810', '#f8e0c4'], body: ['#b07a52', '#6a3820', '#36180a'], ruff: ['#fff6e0', '#efe0c0', '#c8b088'] },
    oldJ: { feather: ['#c8c0b8', '#7e7670', '#3e3834', '#efe8e0'], featherFar: ['#948c86', '#57504c', '#2c2826', '#c0b8b0'], covert: ['#dcd4cc', '#968e86', '#544c46', '#f6f0e8'], body: ['#aaa29a', '#655e58', '#34302c'], skin: ['#f6d8d6', '#dca4a8', '#a8707a'] },
    burnt: { feather: ['#7a6a60', '#3a2e28', '#181210', '#6a5a52'], featherFar: ['#5a4c46', '#2a201c', '#100c0a', '#4a3e38'], covert: ['#8a7a70', '#463830', '#221a16', '#7a6a60'], body: ['#8a6a54', '#4a3020', '#22140a'], ruff: ['#e8dcc8', '#c8b89c', '#8e7e66'] },
    golden: { feather: ['#ffe8a8', '#e0a848', '#8a5a1a', '#fff6d8'], featherFar: ['#d8b070', '#9a6828', '#4e340e', '#f4dca8'], covert: ['#fff0c4', '#ecbc6c', '#a4702a', '#fffbe8'], body: ['#dca060', '#8e5828', '#4a2c0e'] },
    spirit: { feather: ['#ffffff', '#eaf2ff', '#bccbea', '#ffffff'], featherFar: ['#f4f8ff', '#d4def6', '#a4b4dc'], covert: ['#ffffff', '#f0f6ff', '#ccd8f2', '#ffffff'], body: ['#ffffff', '#eaf2ff', '#bccbea'], skin: ['#ffffff', '#f0f0ff', '#c8c8e8'] },
  };
  function flyPose(t, o = {}) {
    const f = o.freq ?? 1.8, amp = o.amp ?? 0.85, cen = o.center ?? 3.62, ph = o.phase ?? 0;
    const th = (tt) => cen + amp * Math.cos(TAU * (f * tt + ph));
    return { pose: { spread: o.spread ?? 1, theta: th(t), talons: o.talons ?? 0, pitch: 0, tailSpread: o.tail ?? 0.5, jaw: o.jaw ?? 0, grip: o.grip ?? 0, wingScale: o.wingScale ?? 1, headRot: o.headRot ?? 0, neck: o.neck ?? 0 }, lag: th(t - 0.07) };
  }
  function bird(c, x, y, s, heading, fp, opt = {}) {
    const R = S.rigFromPose(fp.pose, fp.lag);
    c.save(); c.translate(x, y); c.rotate(heading); c.scale(opt.flip ? 1 : -1, 1);
    K.drawBird(c, { x: 0, y: 0, scale: s, pitch: 0 }, R, opt);
    c.restore();
  }
  const mode = (m, o, fn) => { K.setMode(m, o); fn(); K.setMode('cel'); };
  const speaking = (u, ln) => (ln && u > ln.start && u < ln.end ? 0.35 + 0.45 * Math.abs(Math.sin(u * 13)) : 0);
  const cam = (c, z, fx, fy, rot = 0) => C.camera(c, z, fx, fy, rot);

  // ---------------------------------------------------------------- shots
  const SH = {};

  SH['01'] = (c, u, sh) => {                                   // hook: two brothers before the sun
    const k = u / sh.length, L = { x: 540, y: 1060 };
    C.sky(c, [[0, '#06040e'], [0.3, '#2a0e2a'], [0.48, '#7a2232'], [0.58, '#d8582e'], [0.64, '#ffa048'], [0.7, '#ffd48a'], [1, '#ffcc80']]);
    c.save(); cam(c, lerp(1, 1.12, smooth(k)), 540, 1020);
    C.sun(c, L.x, L.y, 210, '#fff6dc'); C.rays(c, L.x, L.y, u, 0.11, 18);
    C.clouds(c, 760, 380, u * 12, '#ff9a6a', '#2a0c1e', { x: 0, y: 1 }, 0.85, 4, 4);
    C.mountains(c, [{ y: 1520, amp: 220, seed: 3.1, col: ['#3a1222', '#12060c'], rim: 'rgba(255,150,90,1)', haze: 'rgba(200,80,60,0.45)', rock: 0.12 },
                    { y: 1720, amp: 180, seed: 6.4, col: ['#14060c', '#050204'], rim: 'rgba(255,130,80,0.8)', rock: 0.1 }], L, u);
    mode('sil', { dark: '#120608', rim: 'rgba(255,190,110,1)', w: 3.4 }, () => {
      bird(c, 560, 930 + 10 * Math.sin(u * 1.4), 1.2, -0.05, { pose: { spread: 1, theta: 4.3 + 0.06 * Math.sin(u * 2), talons: 0, pitch: 0, tailSpread: 1, jaw: 0, grip: 0 }, lag: 4.3 }, {});
      bird(c, 520, 1140 + 12 * Math.sin(u * 1.7), 0.8, -0.1, flyPose(u, { freq: 1.6, phase: 0.3 }), {});
    });
    C.motes(c, u, 36, '255,210,150', 11);
    c.restore();
  };
  SH['02'] = (c, u, sh) => {
    const k = u / sh.length, L = { x: 540, y: 1060 + 80 * k };
    C.sky(c, [[0, '#06040e'], [0.3, '#2a0e2a'], [0.48, '#7a2232'], [0.58, '#d8582e'], [0.66, '#ffa048'], [0.72, '#ffd48a'], [1, '#ffcc80']]);
    c.save(); cam(c, lerp(1.12, 0.98, smooth(k)), 540, 1020);
    C.sun(c, L.x, L.y, 210, '#fff6dc'); C.rays(c, L.x, L.y, u + 8, 0.1, 18);
    C.clouds(c, 760, 380, (u + 8) * 12, '#ff9a6a', '#2a0c1e', { x: 0, y: 1 }, 0.85, 4, 4);
    C.mountains(c, [{ y: 1520, amp: 220, seed: 3.1, col: ['#3a1222', '#12060c'], rim: 'rgba(255,150,90,1)', haze: 'rgba(200,80,60,0.45)', rock: 0.12 },
                    { y: 1720, amp: 180, seed: 6.4, col: ['#14060c', '#050204'], rim: 'rgba(255,130,80,0.8)', rock: 0.1 }], L, u);
    mode('sil', { dark: '#120608', rim: 'rgba(255,190,110,1)', w: 3 }, () => {
      bird(c, lerp(560, 300, k), lerp(930, 820, k), lerp(1.2, 0.6, k), Math.PI - 0.1, flyPose(u, { freq: 1.4 }), { flip: true });
      bird(c, lerp(520, 330, k), lerp(1140, 880, k), lerp(0.8, 0.45, k), Math.PI - 0.12, flyPose(u, { freq: 1.6, phase: 0.3 }), { flip: true });
    });
    C.motes(c, u + 8, 36, '255,210,150', 11);
    c.restore();
    const out = smooth((u - sh.length + 0.8) / 0.8); if (out > 0) { c.fillStyle = `rgba(0,0,0,${out})`; c.fillRect(0, 0, W, H); }
  };
  SH['T'] = (c, u, sh) => {
    C.sky(c, [[0, '#04030a'], [0.5, '#120a1c'], [1, '#2a1012']]);
    C.stars(c, 120, 0.8, u, 4);
    C.glow(c, 540, 1400, 1000, 'rgba(255,170,90,0.45)', 'rgba(255,120,60,0.15)');
    C.clouds(c, 1450, 420, u * 20, '#ffb070', '#1a0a12', { x: 0, y: -1 }, 0.9, 6, 4);
    const a = smooth(u / 0.9), z = lerp(1.08, 1, smooth(u / sh.length));
    c.save(); c.globalAlpha = a; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.translate(W / 2, 780); c.scale(z, z);
    const g = c.createLinearGradient(0, -120, 0, 120); g.addColorStop(0, '#fff6d0'); g.addColorStop(0.5, '#f4c058'); g.addColorStop(1, '#b8741a');
    c.font = "150px 'Rozha One'"; c.shadowColor = 'rgba(255,170,80,0.6)'; c.shadowBlur = 40;
    c.fillStyle = g; c.fillText('सम्पाती', 0, -90); c.fillText('और जटायु', 0, 90);
    c.shadowBlur = 0; c.globalAlpha = a * smooth((u - 0.6) / 0.8);
    c.font = "700 52px 'Noto Sans Devanagari'"; c.fillStyle = '#f2dcc0'; c.fillText('त्याग की अमर कथा', 0, 250);
    c.restore();
  };

  function himalaya(c, u, L, off) {
    C.sky(c, [[0, '#0b1838'], [0.32, '#33447e'], [0.5, '#b8788a'], [0.6, '#f4b088'], [0.66, '#ffdcae'], [1, '#ffd8a8']]);
    C.stars(c, 50, 1 - smooth(u / 5), u, 2, 500);
    C.sun(c, L.x, L.y, 64); C.rays(c, L.x, L.y, u, 0.09, 16);
    C.clouds(c, 520, 420, u * 18 + off, '#ffd8c4', '#4a3e70', { x: 0, y: 1 }, 0.9, 1, 5);
    C.mountains(c, [
      { y: 1300, amp: 520, seed: 2.1, off, col: ['#9a8ab8', '#6a5a8a'], rim: 'rgba(255,214,176,1)', snow: 'rgba(255,238,236,0.92)', haze: 'rgba(232,176,176,0.55)', jag: 1.3 },
      { y: 1520, amp: 420, seed: 5.3, off: off * 1.4, col: ['#5a4a78', '#2a2244'], rim: 'rgba(255,184,144,0.9)', snow: 'rgba(224,204,232,0.85)', haze: 'rgba(190,130,150,0.5)', jag: 1.2 },
      { y: 1760, amp: 300, seed: 8.7, off: off * 2, col: ['#241a36', '#0c0814'], rim: 'rgba(255,160,120,0.7)' }], L, u);
    C.fogBand(c, 1450, 260, 'rgba(255,206,196,1)', u, 3, 0.32);
  }
  SH['03'] = (c, u, sh) => {
    const k = u / sh.length, L = { x: 620, y: 1150 };
    c.save(); cam(c, 1.05, lerp(470, 640, k), 960);
    himalaya(c, u, L, u * 10);
    mode('real', null, () => {
      bird(c, 300 + u * 55, 820 + 20 * Math.sin(u * 1.3), 0.95, -0.05, flyPose(u, { freq: 1.5 }), { pal: PALS.youngS });
      bird(c, 560 + u * 52, 1010 + 16 * Math.sin(u * 1.5 + 1), 0.76, -0.08, flyPose(u, { freq: 1.8, phase: 0.4 }), { pal: PALS.youngJ });
    });
    C.motes(c, u, 30, '255,224,180', 3);
    c.restore();
  };
  SH['04'] = (c, u, sh) => {                                    // the challenge
    const L = { x: 820, y: 1300 }, l1 = sh.lines[0], l2 = sh.lines[1];
    C.sky(c, [[0, '#14306a'], [0.45, '#4a76b8'], [0.7, '#f0b890'], [0.8, '#ffe0b8'], [1, '#ffe0b8']]);
    C.sun(c, L.x, L.y, 70); C.rays(c, L.x, L.y, u, 0.1);
    C.clouds(c, 420, 360, u * 120, '#fff0e0', '#6a6aa0', { x: 0.3, y: 1 }, 0.9, 7, 4);
    C.clouds(c, 1500, 520, u * 220, '#ffe8d8', '#7a6a98', { x: 0.3, y: -1 }, 0.95, 8, 4);
    const surge = smooth((u - 0.5) / 2.5);
    mode('real', null, () => {
      bird(c, lerp(380, 300, surge), 1060 + 18 * Math.sin(u * 1.6), 1.25, -0.12, flyPose(u, { freq: 1.7, jaw: speaking(u, l2) }), { pal: PALS.youngS });
      bird(c, lerp(560, 760, surge), lerp(860, 700, surge) + 14 * Math.sin(u * 2), 1.05, -0.25, flyPose(u, { freq: 2.4, phase: 0.3, jaw: speaking(u, l1) }), { pal: PALS.youngJ });
    });
    C.clouds(c, 1850, 420, u * 380, '#ffffff', '#8a8ab0', { x: 0, y: -1 }, 0.8, 9, 3);
  };
  function heatHaze(c, u, amt) {                               // shimmer: re-draw the frame in wavy slices
    const b = bufA.getContext('2d'); b.setTransform(1, 0, 0, 1, 0, 0); b.drawImage(c.canvas, 0, 0);
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
    for (let y = 0; y < H; y += 12) c.drawImage(bufA, 0, y, W, 12, Math.sin(y * 0.02 + u * 6) * amt, y, W, 12);
    c.restore();
  }
  SH['05'] = (c, u, sh) => {
    const k = u / sh.length, L = { x: 540, y: 380 };
    C.sky(c, [[0, '#ffe8b0'], [0.15, '#ffb050'], [0.4, '#d8602a'], [0.75, '#5a2a4a'], [1, '#1a1030']]);
    C.sun(c, L.x, L.y, 280, '#fffbe8', 'rgba(255,220,140,0.8)'); C.rays(c, L.x, L.y, u, 0.18, 22);
    C.clouds(c, 1500 + u * 120, 500, u * 30, '#ffd0a0', '#4a2440', { x: 0, y: -1 }, 0.9, 10, 4);
    mode('real', null, () => {
      bird(c, 440, lerp(1450, 1150, k), lerp(0.7, 0.55, k), -1.45, flyPose(u, { freq: 2.6 }), { pal: PALS.youngS });
      bird(c, 660, lerp(1380, 1060, k), lerp(0.6, 0.48, k), -1.6, flyPose(u, { freq: 2.9, phase: 0.3 }), { pal: PALS.youngJ });
    });
    heatHaze(c, u, 4 + 6 * k);
  };
  SH['06'] = (c, u, sh) => {                                    // close-up: Jatayu's wings start to burn
    const ln = sh.lines[0], burn = smooth((u - 0.2) / 1.2);
    C.sky(c, [[0, '#fff2c8'], [0.3, '#ffb048'], [0.7, '#c8401e'], [1, '#3a0e14']]);
    C.glow(c, 860, 200, 1400, 'rgba(255,250,220,1)', 'rgba(255,190,90,0.6)');
    c.save(); cam(c, lerp(1, 1.08, u / sh.length), 540, 960);
    mode('real', null, () => {
      bird(c, 600, 980, 1.35, -0.9, flyPose(u, { freq: 3.4, amp: 1.05, jaw: Math.max(speaking(u, ln), 0.3 * burn) }), {
        pal: PALS.youngJ, after: (cc, R) => {
          for (const w of [R.near, R.far]) {
            for (let i = 0; i < 6; i++) C.fire(cc, w.prim[i].x, w.prim[i].y, 70, 120, u, i + 3, 0.5 * burn);
          }
        },
      });
    });
    C.embers(c, 540, 1300, 900, 1300, u, 70 * burn, 5);
    C.smoke(c, 700, 900, u, 6, 12, '90,70,60', 1.5);
    c.restore();
    heatHaze(c, u, 5);
  };
  SH['07'] = (c, u, sh) => {                                    // the elder brother shields him
    const k = u / sh.length, L = { x: 540, y: 700 };
    C.sky(c, [[0, '#ffefc0'], [0.2, '#ffb048'], [0.45, '#d0481e'], [0.8, '#3a0a14'], [1, '#14040a']]);
    C.sun(c, L.x, L.y, 300, '#ffffff', 'rgba(255,230,160,0.9)'); C.rays(c, L.x, L.y, u, 0.22, 24);
    c.save(); cam(c, lerp(1, 1.1, smooth(k)), 540, 980);
    mode('sil', { dark: '#1a0606', rim: 'rgba(255,220,140,1)', w: 4 }, () => {
      bird(c, 540, 1350 + 10 * Math.sin(u * 2), 0.7, -1.0, flyPose(u, { freq: 3, amp: 1 }), {});
      bird(c, 560, 1000 + 8 * Math.sin(u * 1.6), 1.5, -0.25, { pose: { spread: 1, theta: 4.4 + 0.05 * Math.sin(u * 5), talons: 0.2, pitch: 0, tailSpread: 1, jaw: 0, grip: 0, wingScale: 1.2 }, lag: 4.4 }, {
        after: (cc, R) => { for (const w of [R.near, R.far]) for (let i = 0; i < 10; i += 2) C.fire(cc, w.prim[i].x, w.prim[i].y, 60, 110, u, i + 20, 0.6 * smooth(k * 2)); },
      });
    });
    C.embers(c, 540, 1300, 1000, 1200, u, 60, 7);
    c.restore();
  };
  SH['08'] = (c, u, sh) => {                                    // the fall to the Vindhya
    const k = u / sh.length, L = { x: 820, y: 1260 };
    c.save(); cam(c, 1.05, 540, lerp(820, 1060, smooth(k)));
    C.sky(c, [[0, '#0a0820'], [0.36, '#341a46'], [0.56, '#9a3a48'], [0.68, '#f0783a'], [0.76, '#ffc070'], [1, '#ffc070']]);
    C.stars(c, 60, 0.6, u, 3, 500);
    C.sun(c, L.x, L.y, 80, '#fff0d0'); C.rays(c, L.x, L.y, u, 0.1);
    C.clouds(c, 700, 380, u * 30, '#ff9a6a', '#2a1230', { x: 0.2, y: 1 }, 0.8, 11, 4);
    C.mountains(c, [{ y: 1380, amp: 300, seed: 3.3, col: ['#5a2a4a', '#2a1222'], rim: 'rgba(255,170,110,1)', haze: 'rgba(200,90,90,0.5)' },
                    { y: 1600, amp: 420, seed: 7.7, col: ['#2e1428', '#12060c'], rim: 'rgba(255,140,90,0.9)', jag: 0.7, haze: 'rgba(120,40,60,0.4)' },
                    { y: 1860, amp: 220, seed: 9.9, col: ['#0e060c', '#040204'] }], L, u);
    const f = Math.min(1, k * 1.15), px = lerp(760, 470, f) + 60 * Math.sin(f * 6), py = lerp(260, 1420, f * f);
    for (let i = 14; i >= 1; i--) {                                // smoke trail from earlier positions
      const fk = Math.max(0, f - i * 0.03), sx = lerp(760, 470, fk) + 60 * Math.sin(fk * 6), sy = lerp(260, 1420, fk * fk);
      const r = 30 + i * 9, g = c.createRadialGradient(sx, sy, 0, sx, sy, r);
      g.addColorStop(0, `rgba(70,55,60,${0.4 * (1 - i / 15)})`); g.addColorStop(1, 'rgba(70,55,60,0)');
      c.fillStyle = g; c.fillRect(sx - r, sy - r, 2 * r, 2 * r);
    }
    mode('real', null, () => {
      if (f < 1) bird(c, px, py, 0.9, 1.3 + f * 5, { pose: { spread: 0.35, theta: 3.4, talons: 0.3, pitch: 0, tailSpread: 0.3, jaw: 0.6, grip: 0, wingScale: 0.8 }, lag: 3.6 },
        { pal: PALS.burnt, after: (cc, R) => C.fire(cc, R.near.Tip.x, R.near.Tip.y, 50, 90, u, 31, 0.6) });
      bird(c, lerp(300, -100, k), lerp(420, 300, k), 0.35, Math.PI + 0.1, flyPose(u, { freq: 2 }), { pal: PALS.youngJ, flip: true });
    });
    c.restore();
  };

  function panchavati(c, u, L) {
    C.sky(c, [[0, '#14244a'], [0.38, '#405e8a'], [0.58, '#c89070'], [0.68, '#ffd4a0'], [1, '#ffd4a0']]);
    C.sun(c, L.x, L.y, 58); C.rays(c, L.x, L.y, u, 0.17, 18);
    C.clouds(c, 520, 380, u * 8, '#ffe2c0', '#3a4470', { x: 0.2, y: 1 }, 0.85, 12, 5);
    C.mountains(c, [{ y: 1250, amp: 260, seed: 2.6, col: ['#5a6a86', '#3a4a66'], rim: 'rgba(255,220,170,0.9)', haze: 'rgba(240,200,160,0.6)', jag: 0.8 }], L, u);
    C.forestLine(c, 1420, 300, '#1e3226', 'rgba(255,220,150,0.9)', L, 5);
    C.fogBand(c, 1400, 220, 'rgba(255,220,180,1)', u, 5, 0.4);
  }
  SH['09'] = (c, u, sh) => {                                    // years later: Panchavati
    const k = u / sh.length, L = { x: 820, y: 1180 };
    c.save(); cam(c, lerp(1, 1.08, smooth(k)), 420, 900);
    panchavati(c, u, L);
    C.tree(c, 300, 1800, 1150, 7, '#0e1a12', 'rgba(255,220,140,0.9)', L);
    mode('real', null, () => bird(c, 320, 760, 0.85, -0.05, { pose: { spread: 0.05, theta: 3.0, talons: 0.15, pitch: 0, tailSpread: 0.3, jaw: 0, grip: 1, headRot: -0.15 * Math.sin(u * 0.8) }, lag: 3.0 }, { pal: PALS.oldJ }));
    C.forestLine(c, 1700, 280, '#0a140c', 'rgba(255,200,120,0.6)', L, 9);
    C.motes(c, u, 40, '255,232,170', 5, 0, 700, W, 1000);
    c.restore();
  };

  function vimanCast(c, u, vs, sc, o = {}) {                     // the viman as a backlit silhouette with its crew

    mode('real', null, () => bird(c, 540 - 126 * 3.1, 1000 + 66 * 3.1, 3.1, -0.1, { pose: { spread: 0.1, theta: 3.0, talons: 0, pitch: 0, tailSpread: 0.3, jaw: 0, grip: 0, wingScale: 0.32, headRot: 0.15 }, lag: 3.0 }, { pal: PALS.burnt, sad: true, tear: smooth((u - 0.8) / 1) * ((u - 0.8) / 1.6), brow: '#c8c0b8', noLegs: true }));
    c.restore();
  };
  SH['22'] = (c, u, sh) => {                                    // the divine sight: golden Lanka, then Sita
    const k = u / sh.length, L = { x: 540, y: 1220 }, split = 0.58;
    if (k < split) {
      const q = k / split;
      c.save(); cam(c, lerp(1, 1.55, smooth(q)), 540, lerp(1150, 1080, q));
      C.sky(c, [[0, '#06081e'], [0.32, '#20204a'], [0.5, '#8a3a5a'], [0.6, '#f08a5a'], [0.65, '#ffc888'], [1, '#ffc888']]);
      C.stars(c, 90, 0.8, u, 12, 700);
      C.glow(c, L.x, L.y, 900, 'rgba(255,200,130,0.6)');
      C.sea(c, 1230, u, '#2a2a50', '#04060e', 540, '255,210,140');
      Lanka.lanka(c, 540, 1232, 0.42, u, 0.85, true);
      C.fogBand(c, 1215, 120, 'rgba(255,190,150,1)', u, 21, 0.45);
      c.restore();
    } else {
      const q = (k - split) / (1 - split), M = { x: 820, y: 360 };
      c.save(); cam(c, lerp(1.0, 1.1, smooth(q)), 540, 1100);
      C.sky(c, [[0, '#04061a'], [0.5, '#101838'], [1, '#1a1a2a']]);
      C.stars(c, 120, 0.9, u, 13, 900);
      c.fillStyle = '#f6f2e6'; c.beginPath(); c.arc(M.x, M.y, 56, 0, TAU); c.fill(); C.glow(c, M.x, M.y, 600, 'rgba(200,220,255,0.45)');
      C.forestLine(c, 1350, 360, '#0a1210', 'rgba(200,220,255,0.6)', M, 22);
      const gg = c.createLinearGradient(0, 1400, 0, H); gg.addColorStop(0, '#0e140e'); gg.addColorStop(1, '#030503'); c.fillStyle = gg; c.fillRect(-200, 1400, W + 400, H);
      C.tree(c, 700, 1760, 1100, 31, '#0a120c', 'rgba(200,220,255,0.7)', M);
      for (let i = 0; i < 60; i++) {                               // red Ashoka blossoms
        const x = 700 + (hash(i, 91) - 0.5) * 600, y = 1760 - 1100 * (0.55 + 0.4 * hash(i, 92));
        c.fillStyle = `rgba(230,60,50,${0.6 + 0.4 * hash(i, 93)})`; c.beginPath(); c.arc(x, y, 5 + 4 * hash(i, 94), 0, TAU); c.fill();
      }
      F.figure(c, { x: 520, y: 1720, h: 420, face: 1, kind: 'woman' }, { stance: 'sit', armN: [1.9, -1.2], armF: [1.4, 1.2], head: 0.3 }, M, u, { dark: '#06080a', rim: 'rgba(210,225,255,1)', rimW: 5 });
      C.motes(c, u, 40, '200,255,170', 23, 0, 1000, W, 800);
      c.restore();
      const fi = 1 - smooth(q / 0.15); if (fi > 0) { c.fillStyle = `rgba(255,240,210,${fi})`; c.fillRect(0, 0, W, H); }
    }
  };
  SH['23'] = (c, u, sh) => {                                    // new wings
    const k = u / sh.length, g = smooth((u - 0.4) / 2.2), L = { x: 540, y: 880 };
    C.sky(c, [[0, '#060a26'], [0.35, '#1c2a6a'], [0.6, '#a04a5a'], [1, '#ffb060']]);
    C.stars(c, 80, 1 - g * 0.6, u, 14, H * 0.5);
    C.glow(c, L.x, L.y, 1100, `rgba(255,230,170,${0.5 + 0.4 * g})`, 'rgba(255,180,90,0.3)');
    C.rays(c, L.x, L.y, u, 0.16 + 0.2 * g, 22);
    mode('real', null, () => bird(c, 540, 1040 - 120 * g, 1.3, -0.08, { pose: { spread: lerp(0.15, 1, g), theta: lerp(3.0, 4.45, g) + 0.05 * Math.sin(u * 6) * g, talons: 0.2, pitch: 0, tailSpread: lerp(0.3, 1, g), jaw: 0, grip: 0, wingScale: lerp(0.32, 1.25, g), headRot: -0.35 * g }, lag: lerp(3.0, 4.4, g) },
      { pal: { feather: K.P.feather.map((x, i) => (PALS.golden.feather[i] || x)), featherFar: PALS.golden.featherFar, covert: PALS.golden.covert, body: PALS.golden.body } }));
    C.motes(c, u, 60, '255,236,180', 24, 0, 300, W, 1400, 4);
  };
  SH['24'] = (c, u, sh) => {                                    // the brothers fly together again
    const L = { x: 540, y: 1260 };
    C.sky(c, [[0, '#060a2e'], [0.3, '#24286a'], [0.5, '#8a3a6e'], [0.6, '#f07a5a'], [0.68, '#ffc078'], [1, '#ffe0a8']]);
    C.stars(c, 60, 0.7, u, 15, 600);
    C.sun(c, L.x, L.y, 90); C.rays(c, L.x, L.y, u, 0.18, 18);
    C.clouds(c, 1500, 520, u * 60, '#ffe6c0', '#6a3a66', { x: 0, y: -1 }, 1, 16, 4);
    C.clouds(c, 1780, 600, u * 120, '#ffdcb8', '#4a2450', { x: 0, y: -1 }, 1, 17, 3);
    c.save(); c.globalAlpha = 0.55 + 0.1 * Math.sin(u * 2);
    C.glow(c, 780, 700, 360, 'rgba(255,255,240,0.6)');
    mode('real', null, () => bird(c, 780 + 20 * Math.sin(u * 0.7), 700 + 20 * Math.sin(u * 1.1), 0.75, -0.12, flyPose(u, { freq: 1.3, amp: 0.7, phase: 0.5 }), { pal: PALS.spirit }));
    c.restore();
    mode('real', null, () => bird(c, 380 + 15 * Math.sin(u * 0.8), 960 + 25 * Math.sin(u * 1.2), 1.0, -0.1, flyPose(u, { freq: 1.4, amp: 0.8 }), { pal: { feather: PALS.golden.feather, featherFar: PALS.golden.featherFar, covert: PALS.golden.covert, body: PALS.golden.body } }));
    C.motes(c, u, 30, '255,230,170', 25);
  };
  SH['25'] = (c, u, sh) => {                                    // end card
    const L = { x: 540, y: 1300 };
    C.sky(c, [[0, '#04040e'], [0.4, '#2a1030'], [0.62, '#b8483a'], [0.72, '#ffa050'], [1, '#ffd08a']]);
    C.sun(c, L.x, L.y, 120); C.rays(c, L.x, L.y, u, 0.16, 18);
    C.clouds(c, 1560, 500, u * 30, '#ffb880', '#2a0e20', { x: 0, y: -1 }, 1, 18, 4);
    mode('sil', { dark: '#140608', rim: 'rgba(255,200,120,1)', w: 3 }, () => {
      bird(c, lerp(300, 520, u / sh.length), lerp(1100, 1250, u / sh.length), lerp(0.5, 0.25, u / sh.length), 0.15, flyPose(u, { freq: 1.4 }), {});
      bird(c, lerp(380, 560, u / sh.length), lerp(1160, 1280, u / sh.length), lerp(0.4, 0.2, u / sh.length), 0.15, flyPose(u, { freq: 1.6, phase: 0.4 }), {});
    });
    const a = smooth((u - 0.3) / 0.8);
    c.save(); c.globalAlpha = a; c.textAlign = 'center'; c.textBaseline = 'middle';
    const g = c.createLinearGradient(0, 380, 0, 520); g.addColorStop(0, '#fff6d0'); g.addColorStop(0.5, '#f4c058'); g.addColorStop(1, '#b8741a');
    c.font = "140px 'Rozha One'"; c.shadowColor = 'rgba(255,170,80,0.7)'; c.shadowBlur = 40; c.fillStyle = g; c.fillText('जय श्री राम', W / 2, 460);
    c.shadowBlur = 0; c.globalAlpha = a * smooth((u - 1.2) / 0.8); c.font = "700 46px 'Noto Sans Devanagari'"; c.fillStyle = '#f6e2c8';
    c.fillText('ऐसी ही और कथाओं के लिए — Follow करें', W / 2, 600);
    c.restore();
    const out = smooth((u - sh.length + 1) / 1); if (out > 0) { c.fillStyle = `rgba(0,0,0,${out})`; c.fillRect(0, 0, W, H); }
  };

  // ---------------------------------------------------------------- captions, post, frame
  function captions(c, t) {
    const sh = TL.shots[shotIndex(t)];
    for (const ln of sh.lines) {
      const a0 = sh.start + ln.start - 0.1, a1 = sh.start + ln.end + 0.25;
      if (t < a0 || t > a1) continue;
      const a = smooth((t - a0) / 0.2) * (1 - smooth((t - a1 + 0.2) / 0.2));
      c.save(); c.globalAlpha = a; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = "700 50px 'Noto Sans Devanagari'";
      let lines = [ln.text];
      if (c.measureText(ln.text).width > 940) {
        const w = ln.text.split(' '); let best = 1, bd = 1e9;
        for (let i = 1; i < w.length; i++) { const d = Math.abs(c.measureText(w.slice(0, i).join(' ')).width - c.measureText(w.slice(i).join(' ')).width); if (d < bd) { bd = d; best = i; } }
        lines = [w.slice(0, best).join(' '), w.slice(best).join(' ')];
      }
      const y0 = 1440 - (lines.length - 1) * 34;
      if (ln.who) { c.font = "700 40px 'Noto Sans Devanagari'"; c.fillStyle = '#ffcc66'; c.strokeStyle = 'rgba(0,0,0,0.85)'; c.lineWidth = 9; c.lineJoin = 'round'; c.strokeText(ln.who, W / 2, y0 - 66); c.fillText(ln.who, W / 2, y0 - 66); c.font = "700 50px 'Noto Sans Devanagari'"; }
      lines.forEach((s, i) => { const y = y0 + i * 68; c.lineJoin = 'round'; c.strokeStyle = 'rgba(0,0,0,0.88)'; c.lineWidth = 11; c.strokeText(s, W / 2, y); c.fillStyle = '#ffffff'; c.fillText(s, W / 2, y); });
      c.restore();
    }
  }
  function post(c, f) {
    bctx.filter = 'blur(8px) brightness(0.95) contrast(1.5)'; bctx.clearRect(0, 0, bloom.width, bloom.height); bctx.drawImage(canvas, 0, 0, bloom.width, bloom.height);
    c.save();
    c.globalCompositeOperation = 'screen'; c.globalAlpha = 0.22; c.drawImage(bloom, 0, 0, W, H);
    c.globalCompositeOperation = 'soft-light'; c.globalAlpha = 0.25;                                       // filmic grade
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1a2a5a'); g.addColorStop(0.5, '#808080'); g.addColorStop(1, '#d89a5a'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    const v = c.createRadialGradient(W / 2, H * 0.48, H * 0.3, W / 2, H * 0.5, H * 0.78); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)');
    c.fillStyle = v; c.fillRect(0, 0, W, H);
    const d = gdata.data; for (let i = 0, n = d.length / 4; i < n; i++) { const q = 100 + 56 * hash(f, i, 91); d[4 * i] = d[4 * i + 1] = d[4 * i + 2] = q; d[4 * i + 3] = 255; }
    gctx.putImageData(gdata, 0, 0); c.globalCompositeOperation = 'overlay'; c.globalAlpha = 0.18; c.drawImage(grain, 0, 0, W, H);
    c.restore();
  }
  function shotIndex(t) { for (let i = TL.shots.length - 1; i >= 0; i--) if (t >= TL.shots[i].start) return i; return 0; }
  const HARD = new Set(['13', '14', '15', '16']);                   // hard cuts in the fight
  function drawShot(c, i, t) {
    const sh = TL.shots[i];
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.filter = 'none';
    K.setMode('cel'); SH[sh.id](c, Math.max(0, t - sh.start), sh); K.setMode('cel');
    c.restore();
  }
  function renderFrame(t) {
    const f = Math.round(t * FPS);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    const i = shotIndex(t);
    drawShot(ctx, i, t);
    if (i + 1 < TL.shots.length && !HARD.has(TL.shots[i + 1].id)) {
      const b = TL.shots[i + 1].start, k = (t - (b - 0.45)) / 0.45;
      if (k > 0 && k < 1) { const bb = bufB.getContext('2d'); drawShot(bb, i + 1, t); ctx.globalAlpha = smooth(k); ctx.drawImage(bufB, 0, 0); ctx.globalAlpha = 1; }
    }
    post(ctx, f);
    captions(ctx, t);
  }
  window.renderFrame = renderFrame; window.TOTAL = TL.total;
  Promise.all([document.fonts.load("700 50px 'Noto Sans Devanagari'", 'जटायु'), document.fonts.load("64px 'Rozha One'", 'जटायु')]).then(() => {
    // warm the noise caches so the first frame of every worker is the same
    C.cloudTex('cl1:5', 640, 240, 5, 0.42, 0.7); C.grainTex('rock', 512, 512, 14);
    window.__ready = true;
    const params = new URLSearchParams(location.search);
    if (params.has('render')) { document.body.classList.add('render'); return; }
    if (params.has('t')) { renderFrame(+params.get('t')); return; }
    const t0 = performance.now();
    (function loop(now) { renderFrame(Math.floor(((now - t0) / 1000 % TL.total) * FPS) / FPS); requestAnimationFrame(loop); })(t0);
  });
})();
</script>
